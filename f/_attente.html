<!doctype html>
<!-- PAGE D'ATTENTE : pour un tableau livré avant son film.
     Copier ce fichier dans f/CODE/index.html. Quand le client envoie son film,
     remplacer ce fichier par f/_modele.html avec le lien de la vidéo. -->
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Votre film arrive bientôt | Maison Ravive</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse 70% 50% at 50% 30%,#3A4152,#1E232D);color:#EFEDEA;font:300 1rem/1.6 system-ui,-apple-system,sans-serif;text-align:center;padding:2rem 1.5rem}
.w{max-width:26rem}
.m{font-size:.7rem;letter-spacing:.6em;margin-right:-.6em;color:#E4C995}
h1{font-weight:300;font-size:1.6rem;letter-spacing:.12em;text-transform:uppercase;margin:.6rem 0 1rem}
p{color:rgba(239,237,234,.8)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E4C995;margin:1.2rem 4px 0;animation:b 1.4s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.7}}
a{color:#E4C995}
</style></head>
<body><div class="w"><div class="m">MAISON RAVIVE</div><h1>Votre film arrive bientôt</h1>
<p>Ce tableau attend son film. Dès qu’il sera prêt, il s’ouvrira ici, au même geste.</p>
<div aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<p style="margin-top:1.6rem;font-size:.9rem">Une question ? <a href="mailto:contact@maisonravive.fr">contact@maisonravive.fr</a></p></div></body></html>
